<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soko Online Shop | Handcrafted Quality Products</title>
  <meta name="description" content="Explore authentic handcrafted baskets, textiles, jewellery, ceramics, woodwork, and leather goods at Soko Online Shop." />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- HEADER NAVIGATION -->
  <header class="header-nav">
    <div class="container nav-container">
      <a href="index.html" class="logo-brand">
        <span class="logo-icon">S</span>
        <span>SOKO</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link active">Shop</a></li>
          <li><a href="about.html" class="nav-link">About Us</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="cart-icon-btn" title="View Cart">
          🛒
          <span class="cart-badge-count" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <!-- HERO SECTION WITH WOVEN SVG ACCENT -->
    <section class="hero-banner">
      <div class="container hero-content">
        <!-- Woven SVG Accent Graphic -->
        <svg class="hero-woven-accent" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 20C20 12 44 12 52 20C60 28 60 52 52 44C44 36 20 36 12 44C4 52 4 28 12 20Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 12C12 20 12 44 20 52C28 60 52 60 44 52C36 44 36 20 44 12C52 4 28 4 20 12Z" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="32" cy="32" r="6" fill="currentColor"/>
        </svg>
        <h1 class="hero-title">Handcrafted Treasures & Modern Artisanal Goods</h1>
        <p class="hero-subtitle">Discover unique baskets, textiles, jewellery, ceramics, woodwork, and leather crafted with heritage and care.</p>
        <a href="#catalog" class="btn btn-primary btn-large">Explore Catalog</a>
      </div>
    </section>

    <!-- PRODUCT CATALOG SECTION -->
    <section class="container" id="catalog">
      <div id="products-grid" class="products-grid">
        <!-- Dynamically rendered via JS below -->
      </div>
    </section>
  </main>

  <!-- SCRIPT TAGS -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const gridContainer = document.getElementById('products-grid') || document.getElementById('product-grid');
      if (!gridContainer || typeof SOKO_PRODUCTS === 'undefined') return;

      gridContainer.innerHTML = SOKO_PRODUCTS.map(product => `
        <div class="product-card" data-id="${product.id}">
          <img src="${product.image}" alt="${product.name}" />
          <h3>${product.name}</h3>
          <p class="category">Category: ${product.category}</p>
          <p class="description">${product.description}</p>
          <p class="price">$${Number(product.price).toFixed(2)}</p>
          <button class="add-to-cart-btn" onclick="addToCart('${product.id}')">Add to Cart</button>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
